version: '3.8'

services:
  # ------------------------------------
  # 1. INFRASTRUCTURE SERVICES
  # ------------------------------------
  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fnb_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fnb-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - fnb-net

  # ------------------------------------
  # 2. APP SERVICE (Backend + Frontend)
  # Frontend được build trong Dockerfile và serve bởi Spring Boot
  # ------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env 
    networks:
      - fnb-net
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  mysql_data:
  minio_data:

networks:
  fnb-net:
    driver: bridge