server:
  port: 8081

spring:
  application:
    name: fnb-platform

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 1. Database
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 2000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZmFrZV9zZWNyZXRfZm9yX2RldmVsb3BtZW50X2VuY29kaW5nMTIzNA==}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  security:
    aes-secret: ${APP_AES_SECRET}

  payment:
    vnpay:
      api-url: ${VNPAY_API_URL}
      return-url: ${VNPAY_RETURN_URL}

  frontend:
    url: ${APP_FRONTEND_URL}

# 4. MinIO (Custom)
minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  external-url: ${MINIO_EXTERNAL_URL}
  buckets:
    public-assets: public-assets
    user-profiles: user-profiles
    tenant-assets: tenant-assets

logging:
  level:
    com.project.fnb: DEBUG
    org.springframework.security: INFO