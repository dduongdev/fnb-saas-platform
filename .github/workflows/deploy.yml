# ============================================================
#  GitHub Actions — CI/CD Deploy Workflow (dùng gcloud)
#  Dự án: FNB SaaS Platform
#  Môi trường: Google Cloud Platform (GCP)
#
#  Cách hoạt động:
#    - Push / Merge vào nhánh `staging`   → Deploy lên máy Test
#    - Push / Merge vào nhánh `production` → Deploy lên máy Prod
#
#  Authenticate bằng Service Account (gcloud) thay vì SSH key thuần
#
#  Yêu cầu GitHub Secrets:
#    GCP_SA_KEY            - JSON key của Service Account (tạo bằng setup_gcp.sh)
#    GCP_PROJECT_ID        - GCP Project ID
#    GCP_SSH_PRIVATE_KEY   - Private SSH key (id_rsa_cicd)
#    GCP_SSH_USER          - Username SSH trên instance (vd: ci-cd)
#    GCP_TEST_INSTANCE     - Tên instance Test  (vd: fnb-staging-vm)
#    GCP_TEST_ZONE         - Zone của instance Test
#    GCP_PROD_INSTANCE     - Tên instance Prod   (vd: fnb-production-vm)
#    GCP_PROD_ZONE         - Zone của instance Prod
# ============================================================

name: Deploy to GCP (gcloud)

on:
  push:
    branches:
      - staging
      - production

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  #############################################################################
  #  JOB chung: Build & Test (chạy cho cả 2 nhánh)
  #############################################################################
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🏗️ Build backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: 🧪 Run backend tests
        run: |
          cd backend
          mvn test

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🏗️ Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  #############################################################################
  #  JOB 1: Deploy lên STAGING (máy Test) — dùng gcloud
  #############################################################################
  deploy-staging:
    if: github.ref_name == 'staging'
    name: 🚀 Deploy to Staging (gcloud)
    runs-on: ubuntu-latest
    needs: build

    steps:
      # --- Bước 1: Xác thực với GCP bằng Service Account ---
      - name: 🔐 Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # --- Bước 2: SSH vào máy Test và git pull ---
      # Dùng use_iap: false vì máy có public IP
      # Nếu không có public IP, set use_iap: true + bật IAP API
      - name: 🚢 git pull staging
        id: ssh-pull
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ secrets.GCP_TEST_INSTANCE }}
          zone: ${{ secrets.GCP_TEST_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          user: ${{ secrets.GCP_SSH_USER }}
          use_iap: false
          command: |
            cd ~/fnb-saas-platform && git pull origin staging

      # ════════════════════════════════════════════════════════════════
      #  LỆNH RESTART ỨNG DỤNG
      #  ════════════════════════════════════════════════════════════════
      #  Dự án dùng Docker Compose → lệnh bên dưới phù hợp.
      #  Nếu muốn đổi, hãy sửa command trong step này. Các tuỳ chọn:
      #
      #   [PM2]        pm2 restart all
      #   [Systemd]    sudo systemctl restart fnb-platform
      #   [K8s]        kubectl rollout restart deployment/fnb-platform
      # ════════════════════════════════════════════════════════════════

      # --- Bước 3: Restart Docker Compose ---
      - name: 🔄 Restart app (Docker Compose)
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ secrets.GCP_TEST_INSTANCE }}
          zone: ${{ secrets.GCP_TEST_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          user: ${{ secrets.GCP_SSH_USER }}
          use_iap: false
          command: |
            cd ~/fnb-saas-platform && docker compose down && docker compose up -d --build

      # --- Bước 4: Health check ---
      - name: 🔍 Health check
        run: |
          sleep 15
          TEST_IP=$(gcloud compute instances describe \
            ${{ secrets.GCP_TEST_INSTANCE }} \
            --zone=${{ secrets.GCP_TEST_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          curl -sSf --connect-timeout 10 --max-time 30 \
            "http://${TEST_IP}:8081/actuator/health" \
            && echo "✅ Staging health check passed" \
            || echo "⚠️  Health check failed"

  #############################################################################
  #  JOB 2: Deploy lên PRODUCTION (máy Prod) — dùng gcloud
  #############################################################################
  deploy-production:
    if: github.ref_name == 'production'
    name: 🚀 Deploy to Production (gcloud)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🔐 Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🚢 git pull production
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ secrets.GCP_PROD_INSTANCE }}
          zone: ${{ secrets.GCP_PROD_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          user: ${{ secrets.GCP_SSH_USER }}
          use_iap: false
          command: |
            cd ~/fnb-saas-platform && git pull origin production

      - name: 🔄 Restart app (Docker Compose)
        uses: google-github-actions/ssh-compute@v2
        with:
          instance_name: ${{ secrets.GCP_PROD_INSTANCE }}
          zone: ${{ secrets.GCP_PROD_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          user: ${{ secrets.GCP_SSH_USER }}
          use_iap: false
          command: |
            cd ~/fnb-saas-platform && docker compose down && docker compose up -d --build

      - name: 🔍 Health check
        run: |
          sleep 15
          PROD_IP=$(gcloud compute instances describe \
            ${{ secrets.GCP_PROD_INSTANCE }} \
            --zone=${{ secrets.GCP_PROD_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          curl -sSf --connect-timeout 10 --max-time 30 \
            "http://${PROD_IP}:8081/actuator/health" \
            && echo "✅ Production health check passed" \
            || echo "⚠️  Health check failed"
